version: "3"

includes:
  frontend:
    taskfile: frontend/taskfile.dist.yaml
    dir: ./frontend
  backend:
    taskfile: backend/taskfile.dist.yaml
    dir: ./backend

tasks:
  install:
    deps:
      - frontend:install
      - backend:install

  lint:
    deps:
      - frontend:lint
      - backend:lint

  lint-fix:
    deps:
      - frontend:lint-fix
      - backend:lint-fix

  test:
    deps:
      - backend:test

  generate-schema:
    deps:
      - backend:generate-schema
      - frontend:generate-schema
