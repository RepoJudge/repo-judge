[project]
name = "connection-backend"
version = "0.1.0"
description = "Repo Judge backend starter with repository connection and webhook features"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.135.3",
    "pydantic-settings>=2.13.1",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.49",
    "typer>=0.24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.hatch.build]
sources = ["src"]

[project.scripts]
connection = "app.cli:app"
